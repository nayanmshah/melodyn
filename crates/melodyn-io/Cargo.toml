[package]
name = "melodyn-io"
description = "Audio file I/O for Melodyn: WAV/AIFF reading and writing, buffer management"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
melodyn-core = { workspace = true }
hound = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
md-5 = "0.10"

[dev-dependencies]
env_logger = { workspace = true }
